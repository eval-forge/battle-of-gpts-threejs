<section class="card"><div class="eyebrow">Voxel travelogue · 08</div><h1>Lighthouse Cove</h1><p>A tiny island where the tide never rises and the keeper always leaves a light on.</p></section>

(()=>{

for(let y=0;y<9;y++){let k=(Math.floor(y/2)%2)?'white':'red';for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)vox(k,7,4+y,-4,1)}for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)if(Math.abs(x)+Math.abs(z)>1)vox('wood',7+x,13, -4+z,.65);for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++)if(Math.abs(x)+Math.abs(z)<4)vox('roof',7+x,14,-4+z,1,Math.PI/4);for(let a=0;a<4;a++)vox('window',7+Math.cos(a*Math.PI/2)*1.35,12,-4+Math.sin(a*Math.PI/2)*1.35,.7);
